spring:
  application:
    name: k48-presences
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/k48}
    username: ${DB_USER:k48}
    password: ${DB_PASSWORD:k48}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    whitelabel:
      enabled: false

app:
  code-expiration-minutes: 15
  code-erreurs-max: 5
  blocage-minutes: 2
  code-longueur: 6
